name: Sync Exchange Rates

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC (09:00 EAT)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh EAC exchange rates
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://app.eaziwage.com/api/internal/sync-exchange-rates)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "Response: $BODY"
          echo "Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Exchange rate sync failed with status $HTTP_CODE"
            exit 1
          fi
