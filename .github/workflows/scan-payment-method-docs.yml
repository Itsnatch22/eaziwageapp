name: Scan payment method documents (scheduled)

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes
  workflow_dispatch: {}

concurrency:
  group: scan-payment-method-docs
  cancel-in-progress: true

jobs:
  run-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Run scan POST
        env:
          SCAN_ENDPOINT: ${{ secrets.SCAN_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SCAN_ENDPOINT" ] || [ -z "$CRON_SECRET" ]; then
            echo "SCAN_ENDPOINT or CRON_SECRET not set in repository secrets";
            exit 1;
          fi
          echo "Posting scan request to $SCAN_ENDPOINT"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $CRON_SECRET" "$SCAN_ENDPOINT")
          echo "Response code: $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ] && [ "$HTTP_CODE" -ne 201 ]; then
            echo "Scan endpoint returned non-success status";
            exit 1;
          fi
          echo "Scan request queued/succeeded"
