name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY
    # and the TEST_* credentials are configured as environment secrets scoped to
    # "Production" (GitHub Settings > Environments) — without this key, GitHub
    # Actions never injects them into the job and every secrets.* reference below
    # silently resolves to an empty string.
    environment: Production
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      # Prefer clean CI install, but fall back to `npm install` when lockfile is out-of-sync
      run: npm ci || npm install --no-audit --no-fund
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.local/share/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          playwright-browsers-${{ runner.os }}-

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      # Run with conservative CI flags to reduce flakiness and capture artifacts
      run: npx playwright test --retries=2 --workers=1 --reporter=html
      env:
        CI: true
        PLAYWRIGHT_TEST: 1
        # Must point at a real Supabase project — no fallback. A fake URL here would
        # let
        # env validation pass while every login in global-setup.ts silently fails against
        # a nonexistent host, masking a missing-secret problem instead of surfacing it.
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Seeded test accounts in the same Supabase project — global-setup.ts logs in as
        # each role and skips auth-gated tests gracefully if a credential is missing.
        TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
        TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        TEST_EMPLOYER_EMAIL: ${{ secrets.TEST_EMPLOYER_EMAIL }}
        TEST_EMPLOYER_PASSWORD: ${{ secrets.TEST_EMPLOYER_PASSWORD }}
        TEST_EMPLOYEE_EMAIL: ${{ secrets.TEST_EMPLOYEE_EMAIL }}
        TEST_EMPLOYEE_PASSWORD: ${{ secrets.TEST_EMPLOYEE_PASSWORD }}
        # Below: never exercised against a real external service in these tests (reCAPTCHA is
        # bypassed via the PLAYWRIGHT_TEST sentinel, rate limiting is a no-op, DusuPay webhook
        # signing is self-consistent test-signs/server-verifies) — dummy values only need to
        # satisfy env.ts's format/length validation.
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY || 'test-site-key' }}
        RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY || 'test-secret' }}
        UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL || 'https://example.upstash.io' }}
        UPSTASH_REDIS_REST_TOKEN: ${{ vars.UPSTASH_REDIS_REST_TOKEN || 'test-token' }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'test-resend' }}
        PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY || '1234567890123456' }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'test-admin-password' }}
        STANBIC_SANDBOX_API_KEY: ${{ secrets.STANBIC_SANDBOX_API_KEY || 'test-stanbic' }}
        DUSUPAY_WEBHOOK_SECRET: ${{ secrets.DUSUPAY_WEBHOOK_SECRET || 'test-dusupay-secret' }}
        # Test fallbacks for secrets that env.ts requires but aren't necessary for test logic
        CRON_SECRET: ${{ secrets.CRON_SECRET || 'test-cron-secret' }}
        DUSUPAY_PUBLIC_KEY: ${{ secrets.DUSUPAY_PUBLIC_KEY || 'test-dusupay-pub' }}
        DUSUPAY_SIGNING_KEY: ${{ secrets.DUSUPAY_SIGNING_KEY || 'test-dusupay-signing' }}
        AT_SANDBOX_API_KEY: ${{ secrets.AT_SANDBOX_API_KEY || secrets.AT_API_KEY || 'test-at-api' }}
        AT_SANDBOX_USERNAME: ${{ secrets.AT_SANDBOX_USERNAME || secrets.AT_USERNAME || 'test-at-user' }}
    - name: Upload Playwright artifacts
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: playwright-artifacts
        path: |
          playwright-report/**
          test-results/**
        retention-days: 30